<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Flower Classifier</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #a1c4fd 0%, #187aa8ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
      padding: 40px 30px;
      width: 360px;
      text-align: center;
      animation: fadeInUp 1s ease-out;
    }

    .card h1 {
      color: #fff;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 1px;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.8);
      transition: 0.3s;
    }

    form input:focus {
      background: #fff;
      box-shadow: 0 0 8px rgba(102, 166, 255, 0.8);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #5b6be8, #6a3093);
    }

    .result {
      margin-top: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      color: #fff;
      font-weight: 500;
      animation: pop 0.8s ease-in-out;
    }

    .flower {
      position: absolute;
      bottom: 0;
      right: 30px;
      width: 180px;
      opacity: 0.8;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      .card {
        width: 90%;
        padding: 30px 20px;
      }
      .flower {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Iris Flower Prediction</h1>

    <form action="{{ url_for('predict') }}" method="post">
      <input type="text" name="Sepal_Length" placeholder="Enter Sepal Length" required>
      <input type="text" name="Sepal_Width" placeholder="Enter Sepal Width" required>
      <input type="text" name="Petal_Length" placeholder="Enter Petal Length" required>
      <input type="text" name="Petal_Width" placeholder="Enter Petal Width" required>
      <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
    <div class="result">
       {{ prediction_text }}
    </div>
    {% endif %}
  </div>

  <!-- Decorative Floating Flower -->
  <img src="https://cdn-icons-png.flaticon.com/512/2909/2909765.png" class="flower" alt="Flower">
</body>
</html>
